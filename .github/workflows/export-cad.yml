name: Export tray CAD

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.py'
      - '.github/workflows/export-cad.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.py'
      - '.github/workflows/export-cad.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-cad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          python-version: '3.14.8'
          enable-cache: false
      - name: Install CAD and mesh tools
        run: |
          uv tool install 'cad==0.11.17'
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends prusa-slicer
      - name: Check fit and export the print body
        working-directory: src
        shell: bash
        run: |
          # The interactive CAD CLI prints a local viewer URL; CI needs no viewer.
          exec > >(sed -E 's/([?&]token=)[^[:space:]]+/\1[redacted]/g') 2>&1
          cad server start
          cad run -m coffee_tray.check_compact
          cad run -m coffee_tray.exports
      - name: Upload STEP and STL
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compact-four-tool-tray-${{ github.sha }}
          path: dist/coffee-tray/
          if-no-files-found: error
          retention-days: 30
