<svg xmlns="http://www.w3.org/2000/svg" width="840" height="530" viewBox="0 0 840 530" role="img" aria-labelledby="title desc">
  <title id="title">WDT dock: the handle rests on a ledge and the needles hang free.</title>
  <desc id="desc">Conceptual section of a closed-bottom cup, not to scale. A shelf supports the flat underside of the handle outside the needle bundle. The walls surround the needles; a gap separates their tips from the floor.</desc>
  <rect width="840" height="530" fill="#faf8f3"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="42" y="43" font-size="15" letter-spacing="2" fill="#42655f">COFFEE TRAY  /  CONCEPT SECTION</text>
    <text x="40" y="86" font-size="36" font-weight="bold" fill="#182f2c">Handle-supported WDT dock</text>
    <text x="43" y="115" font-size="15" fill="#596762">Not to scale</text>
    <!-- Section through the flared mouth, annular ledge, sidewalls and floor. -->
    <path d="M125 251 L145 251 L157 269 L190 269 L190 283 L145 283
             L145 454 Q145 462 153 462 L313 462 Q321 462 321 454
             L321 283 L276 283 L276 269 L309 269 L321 251 L341 251
             L341 469 Q341 482 328 482 L138 482 Q125 482 125 469 Z"
          fill="#9fc4b8" stroke="#315c54" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Schematic handle only: no dimensions inferred from the photo. -->
    <path d="M153 159 Q153 148 166 147 L299 147 Q313 148 313 159
             L293 269 L173 269 Z" fill="#514742" stroke="#372f2c" stroke-width="2"/>
    <g fill="none" stroke="#776b63" stroke-width="3" stroke-linecap="round">
      <path d="M171 159 L178 198 M204 157 L207 209 M258 157 L256 209 M293 159 L286 198"/>
    </g>
    <g fill="none" stroke="#666663" stroke-width="2" stroke-linecap="round">
      <path d="M210 270 L200 425 M222 270 L218 424 M235 270 L237 426 M252 270 L264 423"/>
    </g>
    <g fill="none" stroke="#ad632f" stroke-width="5" stroke-linecap="round">
      <path d="M174 269 H188 M278 269 H292"/>
    </g>
    <g fill="none" stroke="#647d74" stroke-width="1.5">
      <path d="M292 269 L374 205 H407"/>
      <path d="M339 348 H407"/>
      <path d="M238 444 H407"/>
    </g>
    <g fill="#203c35" font-size="21" font-weight="bold">
      <text x="423" y="205">Handle rests on a ledge</text>
      <text x="423" y="348">Needles stay enclosed</text>
      <text x="423" y="443">Clear space below tips</text>
    </g>
    <g fill="#506059" font-size="16">
      <text x="423" y="232">The opening clears the full needle spread.</text>
      <text x="423" y="375">A solid wall guards them on every side.</text>
      <text x="423" y="470">Only the handle carries the weight.</text>
    </g>
  </g>
</svg>
